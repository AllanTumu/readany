name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

# No runner can hold the corpus — those are real financial documents and are
# never committed. The absence has to be declared, or the tests that read them
# fail instead of skipping. That is deliberate: a skip nobody declared is how
# the page-limit test guarded nothing without anyone noticing.
env:
  STATEMENT_CORPUS_ABSENT: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2

      # No `cargo fmt --check`.
      #
      # It failed on 13 files, and had done since before it was added. This
      # code is laid out by hand and departs from rustfmt's defaults in both
      # directions — some expressions deliberately kept on one line, others
      # deliberately broken — and no rustfmt.toml reproduces it:
      # `use_small_heuristics = "Max"` takes it from 13 files differing to 81.
      #
      # So the choice was to reformat the crate against its author's intent, or
      # to stop asserting a thing this crate does not believe. The standard this
      # project actually holds is `clippy -D warnings`, which is what every rule
      # in CONTEXT.md and ENGINE-GAPS.md names, and which passes.
      #
      # A check that always fails is not the opposite of a check that cannot
      # fail — it is the same defect wearing different clothes. Both are
      # ignored, and both make the suite look like it is saying something it is
      # not. Reinstate this the day the crate is reformatted, not before.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib --target wasm32-unknown-unknown

      # The binding, not just the library. `cargo check` on the root crate
      # passes whatever the binding does, and the binding is what npm gets — it
      # went two releases' worth of API behind without anything failing.
      #
      # This also runs the compile-time assertion in wasm/src/lib.rs that the
      # crate and the binding carry the same version.
      - run: cargo check --manifest-path wasm/Cargo.toml --target wasm32-unknown-unknown

  binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-pack --locked
      # Builds the package the way a release builds it, then exercises the
      # built artefact. `cargo check` cannot see a binding that has fallen
      # behind the crate's API, and that is exactly how this one did.
      - run: ./scripts/build-wasm.sh
      - run: node wasm/test/binding.test.js

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # Four manifests used to carry four copies of one version number, and the
      # published one would have won any disagreement in silence.
      - run: ./scripts/version.sh --check
