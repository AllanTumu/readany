name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: "https://registry.npmjs.org" }
      - run: cargo install wasm-pack --locked

      # One script, the same one used by hand, rather than a second copy of the
      # build steps that can drift from it. It builds both targets, checks the
      # version across every manifest, proves pkg/package.json still matches
      # npm/package.json, and fails if a build-machine path survived into the
      # blob.
      - run: ./scripts/build-wasm.sh

      - run: npm publish --access public
        working-directory: pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
